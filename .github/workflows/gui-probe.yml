name: GUI probe (temporary)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run id whose windows artifact to probe
        required: true

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '*-windows-x86_64'
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Decompress
        shell: bash
        run: |
          set -euo pipefail
          EXE_ZST="$(find dist -type f -name '*.exe.zst' | head -1)"
          choco install zstandard -y --no-progress >/dev/null
          zstd -d "${EXE_ZST}" -o gvim.exe
          ls -l gvim.exe
      - name: Probes
        shell: bash
        env:
          GUI_JSON: '{"files":{"probe.vim":"call writefile([\"unpins-runtime-ok \"\n  \\ .len(readfile($VIMRUNTIME.\"/filetype.vim\")).\" lines \"\n  \\ .len(getcompletion(\"\", \"color\")).\" colors\"], \"probe.out\")\nqa!\n"}}'
        run: |
          set +e -u
          try() {
            label="$1"; shift
            limit="$1"; shift
            rm -f out.txt probe.out
            echo "=== ${label}"
            start=$SECONDS
            perl -e 'alarm shift; exec @ARGV' "${limit}" "$@" </dev/null >log.txt 2>&1
            rc=$?
            echo "    rc=${rc} elapsed=$((SECONDS-start))s"
            if [ -s log.txt ]; then echo "    --- stdout/stderr:"; sed 's/^/    /' log.txt; fi
            for o in out.txt probe.out; do
              if [ -s "$o" ]; then echo "    --- $o:"; sed 's/^/    /' "$o"; fi
            done
          }
          # 1. the file exactly as the smoke writes it
          jq -r '.files["probe.vim"]' <<<"${GUI_JSON}" | tr -d '\r' > probe.vim
          echo "--- probe.vim as the smoke writes it:"; od -c probe.vim | head -8
          try "-S probe.vim (jq-written)" 25 ./gvim.exe -f -N -u NONE -U NONE -i NONE -S probe.vim
          try "-c source probe.vim (jq-written)" 25 ./gvim.exe -f -N -u NONE -U NONE -i NONE -c 'source probe.vim'
          # 2. the same content from a heredoc
          cat > probe2.vim <<'VIM'
          call writefile(["unpins-runtime-ok "
            \ .len(readfile($VIMRUNTIME."/filetype.vim"))." lines "
            \ .len(getcompletion("", "color"))." colors"], "probe.out")
          qa!
          VIM
          echo "--- probe2.vim from a heredoc:"; od -c probe2.vim | head -8
          try "-S probe2.vim (heredoc)" 25 ./gvim.exe -f -N -u NONE -U NONE -i NONE -S probe2.vim
          # 3. one line, no continuation
          printf 'call writefile(["one-line ok"],"probe.out")\nqa!\n' > probe3.vim
          try "-S probe3.vim (single line)" 25 ./gvim.exe -f -N -u NONE -U NONE -i NONE -S probe3.vim
          exit 0
